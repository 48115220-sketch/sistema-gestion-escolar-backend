server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      globalcors:
        add-to-config-source: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: admin-auth
          uri: http://localhost:8083
          predicates:
            - Path=/auth/**

        - id: admin-service
          uri: http://localhost:8083
          predicates:
            - Path=/admin/**

        - id: alumno-service
          uri: http://localhost:8081
          predicates:
            - Path=/alumnos/**

        - id: curso-service
          uri: http://localhost:8082
          predicates:
            - Path=/cursos/**